version: "2026-09-07"
name: release-readiness
scope: repository-and-environments

environment_boundary:
  development_database: "isolated beta or explicitly confirmed UAT target"
  uat_production_copy: "sensitive point-in-time non-production data; aggregated diagnostics only and no mutable production integrations"
  production_database: "never accessed, inferred, or mutated without explicit owner approval"
  confirm_before_db_work:
    - project
    - branch
    - database
    - role
  schema_application: "manual reviewed SQL only"
  forbidden:
    - automatic_schema_deploy
    - generated_sql_auto_apply
    - development_automation_against_production
    - raw_pii_tokens_hashes_or_object_keys_in_ai_diagnostics
    - uat_mutation_of_production_storage_email_webhooks_or_payments

required_quality_gates:
  - npm_test
  - npm_run_lint
  - npm_run_typecheck
  - npm_run_build
  - npm_run_guard_no_db_schema_automation
  - npm_run_guard_runtime_hardening
  - npm_run_guard_entitlement_enforcement
  - git_diff_check

database_sensitive_checks:
  - "validate prisma/schema.prisma"
  - "run read-only drift comparison against the confirmed beta target"
  - "record drift; do not apply it automatically"

next_layer_promotion_blockers:
  - database_readiness_diagnostic
  - production_dependency_security_updates
  - idempotent_club_provisioning_and_activation

