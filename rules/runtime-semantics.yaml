version: "2026-06-30"
name: runtime-semantics
scope: scheduling-runtime

player_lifecycle:
  protected_flow:
    - WAITING
    - NEXT_MATCH_OR_PRIORITY
    - PLAYING
    - JUST_FINISHED
    - WAITING
  statuses:
    WAITING:
      meaning: "Eligible and waiting."
      eligible_for_suggestion: true
      eligible_for_replacement: true
    PRIORITY:
      meaning: "Prepared in a next match or ready court."
      eligible_for_suggestion: false
      eligible_for_replacement: "only when in another suggestion and not on court"
    PLAYING:
      meaning: "Currently active on a court."
      eligible_for_suggestion: false
      eligible_for_replacement: false
    JUST_FINISHED:
      meaning: "Recently completed match and cooling down."
      eligible_for_suggestion: "allowed with penalties/current heuristic"
      eligible_for_replacement: true
      protected: true
    RESTING:
      meaning: "Unavailable."
      eligible_for_suggestion: false
      eligible_for_replacement: false
    FINISHED:
      meaning: "Session completed/locked."
      eligible_for_suggestion: false
      eligible_for_replacement: false

cooldown:
  protected: true
  just_finished_duration_ms: 120000
  transition: "JUST_FINISHED -> WAITING"
  rationale:
    - fairness
    - fatigue_management
    - anti_repeat
    - queue_continuity

court_lifecycle:
  statuses:
    EMPTY:
      meaning: "Court has no roster and can receive a suggestion."
    READY:
      meaning: "Court has roster but match has not started."
    PLAYING:
      meaning: "Match is running."
  protected_transitions:
    - "EMPTY -> READY"
    - "READY -> PLAYING"
    - "READY -> EMPTY"
    - "PLAYING -> EMPTY"

match_history:
  purpose: "Post-match lookup and player filtering."
  created_on: "Operator ends a PLAYING match."
  not_source_of_truth_for:
    - live_runtime_state
    - queue_replay
    - event_sourcing

runtime_eligibility:
  minimum_players_formula: "court_count * 6"
  disabled_when:
    - "session is not ACTIVE"
    - "session is COMPLETED or CANCELLED"
    - "players.length < court_count * 6"
  auto_suggestion_requires:
    statuses:
      - WAITING
      - JUST_FINISHED
    attendance_positive_tags:
      - ARRIVED
      - PRIORITY
      - HOST
    excluded_tags:
      - INJURED
      - LEFT_EARLY
    default_ineligible_tag: NOT_ARRIVED
    host_rule: "Avoid HOST when at least four non-host eligible players exist."
    blocked_behavior: "Show operator-facing reason and do not commit an empty runtime snapshot."

auto_suggestion_scoring:
  effective_level:
    male: "displayed level"
    female: "displayed level - 1 for internal balancing only"
    ui_labels: "unchanged"
  priorities:
    - fewer_matches
    - team_level_balance
    - same_format_matchup_when_balanced
    - pair_and_roster_variety
    - anti_repeat
  same_format_matchups:
    - "nam-nam vs nam-nam"
    - "nu-nu vs nu-nu"
    - "nam-nu vs nam-nu"
  fallback_matchups:
    - "nam-nu vs nam-nam"
    - "nam-nu vs nu-nu"
  discouraged_matchups:
    - "nam-nam vs nu-nu"

persistence:
  live_owner: "zustand"
  recovery_owner: "database_current_snapshot"
  court_identity: "court_number derived from play_sessions.court_count"
  commit_model: "explicit important operator actions"
  forbidden:
    - event_sourcing
    - cqrs
    - continuous_db_write_loop
