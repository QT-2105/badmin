version: "2026-08-25"
name: forbidden-patterns
scope: repository

forbidden_patterns:
  - id: runtime_as_root_module
    severity: critical
    rule: "Do not add realtime runtime as root navigation."
    rationale: "Điều phối belongs inside a Play Session."

  - id: event_sourcing_runtime
    severity: critical
    rule: "Do not make runtime events the source of truth."
    rationale: "Badmin uses current-state snapshots for recovery."

  - id: match_history_as_runtime_truth
    severity: critical
    rule: "Do not use match_histories as the source of truth for live scheduling state."
    rationale: "Match history is lookup data created after matches end, not runtime replay."

  - id: cqrs_runtime
    severity: critical
    rule: "Do not split runtime into CQRS command/read models."
    rationale: "Live operation needs lightweight state transitions."

  - id: global_player_system
    severity: critical
    rule: "Do not replace session_players with users, members, or global players."
    rationale: "Players are session-scoped."

  - id: required_courts_catalog
    severity: high
    rule: "Do not reintroduce a mandatory physical court catalog for current runtime."
    rationale: "Current courts are generated from play_sessions.court_count and persisted by court_number."

  - id: mandatory_auto_matchmaking
    severity: critical
    rule: "Do not auto-apply suggestions without operator action."
    rationale: "Operator authority is final."

  - id: continuous_runtime_db_writes
    severity: high
    rule: "Do not write or select DB continuously for temporary runtime state."
    rationale: "Runtime should commit on important clicks and stay responsive."

  - id: playing_player_replacement
    severity: critical
    rule: "Do not allow PLAYING players to be selected as suggestion replacements."
    rationale: "This corrupts live court state."

  - id: reintroduce_post_match_cooldown
    severity: critical
    rule: "Do not reintroduce a mandatory cooldown, JUST_FINISHED lock, or hidden time-based block after a match."
    rationale: "Players return to WAITING immediately; lastFinishedAt is soft metadata and the operator may schedule consecutive matches."

  - id: late_arrival_full_catch_up
    severity: high
    rule: "Do not treat matches played before arrival as matches owed to a late player."
    rationale: "Late arrivals receive limited entry assistance while wait protection preserves fairness for earlier arrivals."

  - id: couple_global_or_absolute
    severity: critical
    rule: "Do not make Couple global, cross-session, active in every format, or stronger than eligibility and acceptable balance."
    rationale: "Couple is session-scoped and fixes teammates only in its registered format."

  - id: broad_anti_repeat
    severity: high
    rule: "Do not penalize last court, ordinary partner repetition, or ordinary opponent repetition."
    rationale: "Only exact recent quartet repetition is avoided when another acceptable option exists."

  - id: inventory_direct_update
    severity: critical
    rule: "Do not update shuttlecock_inventory directly without creating shuttlecock_movements."
    rationale: "Movements are the stock reconciliation source."

  - id: manual_finance_requires_session
    severity: high
    rule: "Do not require session_id for manually created finance transactions."
    rationale: "Manual Thu chi is intentionally independent from session selection."

  - id: noisy_finance_filters
    severity: medium
    rule: "Do not reintroduce complex transaction filters beyond selected period and newest/oldest sort without owner request."
    rationale: "The owner simplified finance UI for clarity."

  - id: erp_transformation
    severity: critical
    rule: "Do not turn finance/inventory/settings into ERP or warehouse management."
    rationale: "Badmin is lightweight badminton operational software."

  - id: merge_users_with_players
    severity: critical
    rule: "Do not merge app_users with session_players or turn user administration into global badminton membership."
    rationale: "Application access and session participation are separate domains."

  - id: bypass_permission_guards
    severity: critical
    rule: "Do not remove or bypass existing page/API permission guards or broaden bootstrap behavior without owner approval."
    rationale: "Người dùng is an administrator capability and must remain access-controlled."

  - id: production_database_from_development
    severity: critical
    rule: "Do not point development automation at production data, infer production state from beta, or apply generated schema SQL automatically."
    rationale: "Beta development is intentionally isolated to protect real operational data."

  - id: client_controlled_tenant
    severity: critical
    rule: "Do not trust club_id from request body, query, untrusted header, or URL as tenant authorization."
    rationale: "Tenant identity comes from the authenticated server-side session; club code is only a locator."

  - id: unscoped_tenant_query
    severity: critical
    rule: "Do not read, aggregate, update, or delete tenant-owned data without authenticated club scope."
    rationale: "One omitted tenant predicate can expose or mutate another club's data."

  - id: cross_tenant_relation
    severity: critical
    rule: "Do not rely on globally unique IDs alone for tenant parent/child relations."
    rationale: "Application validation and composite tenant foreign keys must reject cross-club references."

  - id: plan_branching_in_badmin
    severity: high
    rule: "Do not branch Badmin behavior on plan, promotion, or billing names."
    rationale: "The Control Plane owns commercial logic; Badmin consumes effective capabilities and limits."

  - id: big_bang_tenant_migration
    severity: critical
    rule: "Do not combine tenant columns, backfill, constraints, auth/routes, compatibility cleanup, and customer onboarding into one release."
    rationale: "Expand/write/backfill/constrain/switch phases preserve Legacy Club data and rollback paths."

  - id: second_tenant_before_isolation
    severity: critical
    rule: "Do not onboard a second customer club before tenant data, auth, cache, storage, runtime, completion, finance, and inventory gates pass."
    rationale: "A second tenant converts every remaining global operation into a data-isolation risk."

  - id: tenantization_runtime_rewrite
    severity: critical
    rule: "Do not rewrite scheduler or protected runtime semantics merely to add tenant boundaries."
    rationale: "Tenantization scopes authentication and persistence around the proven runtime implementation."
