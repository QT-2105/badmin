version: "2026-09-07"
name: multi-tenant-isolation
scope: approved-target-and-migration
status: "target design; requirements become runtime gates only as their migration phase is implemented"

architecture:
  tenant_model: "shared PostgreSQL tables with club_id row ownership"
  canonical_tenant_identity: "club UUID"
  club_code_role: "human-facing login and URL locator only"
  applications:
    control_plane:
      owns:
        - club_registration
        - club_lifecycle
        - plans_and_plan_versions
        - subscriptions_and_trials
        - feature_overrides
        - effective_entitlement_projection
        - system_administration
    badmin:
      owns:
        - tenant_users_and_permissions
        - tenant_settings_and_branding
        - schedule_and_sessions
        - runtime_and_match_history
        - completion_and_finance
        - shuttlecock_inventory
        - tenant_images
  database_roles:
    - migration_role
    - control_plane_runtime_role
    - badmin_runtime_role
  schema_authority: "one reviewed migration authority for the shared database"

tenant_context:
  server_owned_fields:
    - club_id
    - club_code
    - club_status
    - user_id
    - role
    - permissions
    - effective_features
    - effective_limits
    - entitlement_version
  forbidden_sources_for_club_id:
    - request_body
    - query_string
    - untrusted_header
    - url_without_auth_session_comparison
  required_order:
    - authenticate_session
    - establish_tenant_context
    - validate_url_club_locator
    - enforce_club_status_policy
    - enforce_user_permission
    - enforce_effective_entitlement_when_applicable
    - enforce_domain_invariants
    - use_tenant_scoped_repository
    - rely_on_database_tenant_constraints

data_rules:
  classify_every_table_as:
    - CONTROL_OWNED
    - TENANT_OWNED
    - GLOBAL_INTERNAL
  tenant_owned_requirements:
    - non_null_club_id_after_backfill
    - tenant_predicate_on_every_read_and_mutation
    - tenant_scoped_unique_constraints
    - composite_foreign_keys_for_tenant_relations
    - tenant_first_indexes_where_supported_by_queries
  cross_tenant_resource_response: "not found unless an explicit system-admin API requires otherwise"
  json_reference_rule: "validate tenant and parent ownership in application code because JSON cannot enforce player foreign keys"
  nullable_relation_rule: "tenantization must not make an intentionally optional domain relation mandatory"

phase_2_schema_contract:
  authority: "docs/multi-tenant-schema-contract.md"
  current_prisma_classification:
    tenant_owned_count: 18
    control_owned_count: 0
    global_internal_count: 0
  required_control_projection:
    - control.clubs
    - control.club_entitlements
  operational_rules:
    - "Every current Prisma model receives club_id through expand, compatibility write, backfill, and constraint phases."
    - "Every tenant child uses a composite club relation; globally unique UUIDs alone are insufficient."
    - "app_settings becomes one row keyed by club_id only after repositories stop using id=default."
    - "play_sessions.shuttlecock_product_id, app_settings.default_payment_bank_account_id, and session_transactions.session_id retain current nullability."
    - "runtime_courts.runtime_match_id must resolve to the same club and session."
    - "runtime JSON rosters and match-history participant session equality require service validation where SQL cannot express the current shape without redundant fields."
    - "session_summaries is one row per tenant session."
    - "No user_login_identifiers table is added for the current one-value-per-identifier-type requirement."
  migration_safety:
    - nullable_expand_before_writes
    - compatibility_writes_before_backfill
    - parent_before_child_backfill
    - reconciliation_before_constraints
    - validated_composite_fks_before_second_tenant
    - retain_legacy_constraints_until_application_cutover_is_proven

phase_3_control_foundation:
  authority: "docs/multi-tenant-control-foundation.md"
  phase_3a_status: complete
  phase_3b_status: complete_on_confirmed_uat
  phase_3c_status: complete_read_only_non_enforcing
  execution_target_fingerprint: "c2f96ce9dcd6"
  legacy_club_id: "aa1f1aa3-c438-4498-96e9-ab228cd51f4f"
  legacy_club_code: "tt-badminton"
  badmin_effective_uat_role: "badmin_uat_app"
  foundation_tables:
    - control.clubs
    - control.club_entitlements
  legacy_capabilities:
    - dashboard
    - schedule
    - session.runtime
    - session.completion
    - finance
    - inventory
    - users
    - settings
  initial_limits: {}
  badmin_phase_3c_read_columns:
    clubs:
      - id
      - code
      - name
      - status
    club_entitlements:
      - club_id
      - version
  forbidden_before_phase_3b_confirmation:
    - create_manual_migration_sql
    - connect_or_apply_to_uat
    - create_legacy_club
    - grant_environment_login_roles
  forbidden_in_phase_3c:
    - entitlement_enforcement
    - auth_or_route_tenant_switch
    - client_controlled_legacy_club_id
    - control_table_mutation_by_badmin
  phase_3_authorization_boundary: "Phase 4 required and received a separate explicit owner instruction"

phase_4_nullable_expand:
  status: complete_on_confirmed_uat
  execution_target_fingerprint: "c2f96ce9dcd6"
  subphases:
    phase_4a:
      tables: [app_users, auth_sessions, app_role_permissions, app_settings, payment_bank_accounts]
    phase_4b:
      tables: [play_dates, play_sessions, session_players]
    phase_4c:
      tables: [runtime_courts, runtime_matches, match_histories, match_history_players, session_summaries]
    phase_4d:
      tables: [session_transactions, shuttlecock_products, shuttlecock_inventory, shuttlecock_movements, session_player_images]
  required_shape:
    type: uuid
    nullable: true
    default: null
  implemented:
    - prisma_optional_scalar_fields
    - reviewed_manual_expand_sql
    - read_only_validation_sql
    - emergency_rollback_sql
    - uat_rehearsal
    - application_regression
  forbidden_and_absent:
    - club_id_backfill
    - club_id_not_null
    - tenant_foreign_keys
    - tenant_unique_replacements
    - tenant_indexes_without_query_need
    - compatibility_writes
    - auth_identifier_or_login_changes
  stop_boundary: "satisfied by the explicit Phase 5 owner instruction"

phase_5_compatibility_writes:
  status: complete
  legacy_club_id: "aa1f1aa3-c438-4498-96e9-ab228cd51f4f"
  server_source: BADMIN_LEGACY_CLUB_ID
  context_policy:
    - uuid_validated
    - fail_closed_when_missing_or_invalid
    - structured_missing_context_log
    - no_client_override
  write_policy:
    - stamp_all_new_tenant_rows
    - stamp_nested_and_bulk_creates
    - leave_existing_update_rows_unchanged_until_backfill
    - preserve_null_legacy_reads_during_compatibility
  validation:
    focused_tests: 97
    source_write_guard: passed
    uat_fingerprint: "c2f96ce9dcd6"
    checked_tables: 18
    positive_new_null_delta: 0
    unexpected_club_rows: 0
  forbidden_and_absent:
    - client_controlled_tenant
    - implicit_backfill
    - login_or_route_change
    - entitlement_enforcement
    - tenant_constraints_or_indexes
    - domain_behavior_change
  stop_boundary: "satisfied by the explicit Phase 6 owner instruction"

phase_6_backfill_reconciliation:
  status: complete_on_confirmed_uat
  target_fingerprint: "c2f96ce9dcd6"
  legacy_club_id: "aa1f1aa3-c438-4498-96e9-ab228cd51f4f"
