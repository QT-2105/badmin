repository_rules:
  required:
    - "Tenant-owned repositories accept TenantContext or are created from a tenant-bound factory."
    - "Aggregates, counts, bulk updates, and bulk deletes are tenant-scoped."
    - "Nested writes and transactions validate every tenant-owned relation."
    - "Raw SQL carries an explicit tenant predicate and receives focused review."
  forbidden:
    - global_find_by_id_for_tenant_entity
    - unscoped_tenant_aggregate
    - unscoped_bulk_update
    - unscoped_bulk_delete
    - trusting_client_club_id
    - relying_only_on_transparent_orm_injection

authentication:
  user_membership: "one app user belongs to exactly one club"
  session_binding: "auth session binds user_id and club_id while retaining secure hashed tokens and cookie behavior"
  login_input:
    - selected_club
    - one_username_email_or_phone_identifier
    - password
  identity_uniqueness:
    - club_id_and_username_normalized
    - club_id_and_email_normalized_when_present
    - club_id_and_phone_normalized_when_present
  user_login_identifiers_table: "deferred until multi-alias or multi-contact login is required"
  generic_failure: "do not disclose whether the identifier exists in another club"
  bootstrap_target: "replace global first-owner bootstrap with idempotent club provisioning and activation"
  current_compatibility:
    legacy_payload_without_club_code: "resolve only the configured Legacy Club"
    public_club_fields: [code, name]
    malformed_identifier_response: generic_tenant_login_failure
    non_legacy_login: rollout_blocked
  invariants:
    - app_users_remain_separate_from_session_players
    - preserve_owner_manager_operator_viewer_roles
    - preserve_secure_token_hash_and_cookie_semantics

provisioning:
  phase_13_status: complete_on_confirmed_uat
  registration_owner: control_plane
  badmin_public_registration_api: forbidden
  club_code:
    canonical: lowercase_ascii_hyphenated
    unique_authority: control_clubs_database_constraint
    duplicate_name: allowed_with_warning_and_area_or_random_suffix_suggestions
  seed_transaction:
    initial_club_status: PROVISIONING
    creates: [effective_entitlement, app_settings, default_role_permissions, disabled_owner, hashed_activation, idempotency_receipt]
    idempotency: advisory_transaction_lock_and_canonical_payload_fingerprint
    changed_payload_retry: reject
  secrets:
    plaintext_password_crosses_control_plane: false
    database_activation_token: sha256_hash_only
    database_password: scrypt_hash_only
    activation_url_secret_location: fragment
  activation:
    badmin_table_mutation: denied
    allowed_boundary: security_definer_function_only
    complete_seed_required: true
    club_active_transition: last_statement_in_atomic_activation
    successful_retry: same_ids_without_reseed_or_password_rewrite
  failure_retry:
    provisioning_failure: transaction_rollback_then_same_request_retry
    email_or_token_failure: control_plane_rotates_unused_token_hash_without_reseed
  current_rollout:
    manual_migration_applied: true
    uat_rollback_only_rehearsal: passed_zero_residue
    target_fingerprint: "c2f96ce9dcd6"
    migration_role: neondb_owner
    security_definer_owner: badmin_schema_owner
    non_legacy_login: exact_uuid_allowlist_disabled_by_default
    tenant_number_two: inactive

tenant_context_runtime:
