name: CI/CD Heroku

on:
  push:
    branches:
      - heroku-prod
  pull_request:
    branches:
      - heroku-prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Source
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/badmin
      DATABASE_URL_UNPOOLED: postgresql://user:password@localhost:5432/badmin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Guard DB schema automation
        run: npm run guard:no-db-schema-automation

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Setup Docker Buildx
        if: github.event_name != 'push'
        uses: docker/setup-buildx-action@v3

      - name: Validate Heroku container image
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: badmin:ci
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Heroku
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/heroku-prod'
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$HEROKU_API_KEY" || { echo "Missing production secret: HEROKU_API_KEY"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "Missing production variable: HEROKU_APP_NAME"; exit 1; }
          test -n "$NEXT_PUBLIC_APP_URL" || { echo "Missing production variable: NEXT_PUBLIC_APP_URL"; exit 1; }
          [[ "$HEROKU_APP_NAME" =~ ^[a-z][a-z0-9-]{2,29}$ ]] || { echo "Invalid HEROKU_APP_NAME"; exit 1; }
          [[ "$NEXT_PUBLIC_APP_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "NEXT_PUBLIC_APP_URL must be an HTTPS URL"; exit 1; }

      - name: Login to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Validate Neon config on Heroku
        shell: bash
        run: |
          config_json="$(curl --fail-with-body --silent --show-error \
            "https://api.heroku.com/apps/${HEROKU_APP_NAME}/config-vars" \
            --header "Accept: application/vnd.heroku+json; version=3" \
            --header "Authorization: Bearer ${HEROKU_API_KEY}")"

          for key in DATABASE_URL DATABASE_URL_UNPOOLED; do
            if ! jq --exit-status --arg key "$key" \
              '.[$key] | type == "string" and length > 0' \
              <<<"$config_json" >/dev/null; then
              echo "Missing Heroku Config Var: $key"
              exit 1
            fi
          done

      # Heroku Container Registry accepts Docker Image Manifest V2 Schema 2,
      # but not OCI manifests. Load the single-platform build into Docker first,
      # then let the Docker daemon push the compatible manifest.
      - name: Build Heroku image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: badmin-heroku:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Heroku image
        shell: bash
        run: |
          local_image="badmin-heroku:${GITHUB_SHA}"
          registry_image="registry.heroku.com/${HEROKU_APP_NAME}/web"
          docker tag "$local_image" "$registry_image"
          docker push "$registry_image"

      - name: Release image on Heroku
        shell: bash
        run: |
          image="registry.heroku.com/${HEROKU_APP_NAME}/web"
          image_id="$(docker inspect "$image" --format='{{.Id}}')"

          curl --fail-with-body --silent --show-error \
            --request PATCH "https://api.heroku.com/apps/${HEROKU_APP_NAME}/formation" \
            --header "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            --header "Authorization: Bearer ${HEROKU_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"${image_id}\"}]}" \
            --output /dev/null

      - name: Verify production health
        shell: bash
        run: |
          app_url="$(curl --fail-with-body --silent --show-error \
            "https://api.heroku.com/apps/${HEROKU_APP_NAME}" \
            --header "Accept: application/vnd.heroku+json; version=3" \
            --header "Authorization: Bearer ${HEROKU_API_KEY}" \
            | jq --exit-status --raw-output '.web_url')"

          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "${app_url%/}/api/health"
