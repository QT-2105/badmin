name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/qt-2105/badmin
  DATABASE_URL: postgresql://user:password@localhost:5432/badmin
  DATABASE_URL_UNPOOLED: postgresql://user:password@localhost:5432/badmin
  NEXT_PUBLIC_APP_URL: https://ttclubminton.me

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            cd /opt/ttclubminton
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u QT-2105 --password-stdin
            export BADMIN_IMAGE="${{ env.IMAGE_NAME }}:latest"
            docker compose pull badmin
            docker compose up -d --no-build badmin
            docker compose exec -T badmin npx prisma migrate deploy
            docker image prune -f